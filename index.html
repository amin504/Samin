}
function fileDataUrlToObjectUrl(dataUrl,mime){
  try{return URL.createObjectURL(dataUrlToBlob(dataUrl,mime));}catch{return null;}
}
function closeFileViewer(){
  const el=document.getElementById('saminFileViewer');
  if(el){ const url=el.dataset.objectUrl; if(url) try{URL.revokeObjectURL(url)}catch{}; el.remove(); }
  document.removeEventListener('keydown',fileViewerKeyHandler,true);
}
let fileViewerState=null;
function getViewerImageIds(){
  return [...document.querySelectorAll('[data-file-id][data-file-openable="1"]')]
    .map(el=>el.dataset.fileId)
    .filter(id=>id);
}
function fileViewerKeyHandler(e){
  if(e.key==='Escape'){ closeFileViewer(); return; }
  if(!fileViewerState) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); navigateViewerImage(-1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); navigateViewerImage(1); }
  if((e.key==='+'||e.key==='=')){ e.preventDefault(); changeViewerZoom(.2); }
  if(e.key==='-'){ e.preventDefault(); changeViewerZoom(-.2); }
  if(e.key==='0'){ e.preventDefault(); resetViewerZoom(); }
}
function setViewerZoom(value){
  if(!fileViewerState) return;
  fileViewerState.zoom=Math.min(5,Math.max(0.5,value));
  fileViewerState.x=fileViewerState.zoom===1?0:fileViewerState.x;
  fileViewerState.y=fileViewerState.zoom===1?0:fileViewerState.y;
  const img=document.querySelector('#saminFileViewer .file-viewer-image-stage img');
  if(img){ img.style.transform=`translate(${fileViewerState.x}px,${fileViewerState.y}px) scale(${fileViewerState.zoom})`; }
  const label=document.querySelector('#saminFileViewer .file-viewer-zoom-label');
  if(label) label.textContent=Math.round(fileViewerState.zoom*100)+'٪';
}
function changeViewerZoom(delta){ setViewerZoom((fileViewerState?.zoom||1)+delta); }
function resetViewerZoom(){ if(fileViewerState){fileViewerState.zoom=1;fileViewerState.x=0;fileViewerState.y=0;setViewerZoom(1);} }
function wireViewerImageInteractions(){
  const stage=document.querySelector('#saminFileViewer .file-viewer-image-stage');
  const img=stage?.querySelector('img');
  if(!stage||!img) return;
  let dragging=false,startX=0,startY=0,baseX=0,baseY=0;
  img.addEventListener('wheel',e=>{e.preventDefault(); changeViewerZoom(e.deltaY<0?.2:-.2);},{passive:false});
  img.addEventListener('pointerdown',e=>{
    if((fileViewerState?.zoom||1)<=1) return;
    dragging=true; img.classList.add('dragging'); img.setPointerCapture?.(e.pointerId);
    startX=e.clientX; startY=e.clientY; baseX=fileViewerState.x; baseY=fileViewerState.y;
  });
  img.addEventListener('pointermove',e=>{
    if(!dragging||!fileViewerState) return;
    fileViewerState.x=baseX+(e.clientX-startX); fileViewerState.y=baseY+(e.clientY-startY);
    img.style.transform=`translate(${fileViewerState.x}px,${fileViewerState.y}px) scale(${fileViewerState.zoom})`;
  });
  const stop=()=>{dragging=false;img.classList.remove('dragging');};
  img.addEventListener('pointerup',stop); img.addEventListener('pointercancel',stop);
}
async function navigateViewerImage(direction){
  if(!fileViewerState?.imageIds?.length) return;
  const current=fileViewerState.imageIds.indexOf(fileViewerState.id);
  if(current<0) return;
  let next=current+direction;
  if(next<0) next=fileViewerState.imageIds.length-1;
  if(next>=fileViewerState.imageIds.length) next=0;
  await openFileInSamin(fileViewerState.imageIds[next], true);
}
async function openFileInSamin(id, preserveGallery=false){
  const meta=await dbGet('fileMetadata',id).catch(()=>null);
  if(!meta?.dataUrl){ toast('فایل قابل نمایش نیست','error'); return; }
  const mime=(meta.mime||'application/octet-stream').toLowerCase();
  if(!isFileOpenable(meta)){ toast('این نوع فایل در مرورگر قابل نمایش مستقیم نیست؛ از گزینه دانلود استفاده کنید','error'); return; }
  closeFileViewer();
  const url=fileDataUrlToObjectUrl(meta.dataUrl,mime);
  if(!url){toast('نمایش فایل انجام نشد','error');return;}
  const isImage=mime.startsWith('image/');
  const imageIds = preserveGallery && fileViewerState?.imageIds ? fileViewerState.imageIds : (isImage ? getViewerImageIds() : []);
  fileViewerState=isImage ? {id, imageIds, zoom:1, x:0, y:0} : null;
  let content='';
  if(isImage) content=`<div class="file-viewer-image-stage"><img src="${escAttr(url)}" alt="${escAttr(meta.name||'تصویر')}">${imageIds.length>1?`<button type="button" class="file-viewer-nav prev" id="viewerPrev" title="تصویر قبلی">${icon('chevron-right')}</button><button type="button" class="file-viewer-nav next" id="viewerNext" title="تصویر بعدی">${icon('chevron-left')}</button>`:''}</div>`;
  else if(mime==='application/pdf') content=`<iframe src="${escAttr(url)}" title="${escAttr(meta.name||'PDF')}"></iframe>`;
  else if(mime.startsWith('video/')) content=`<video src="${escAttr(url)}" controls playsinline></video>`;
  else if(mime.startsWith('audio/')) content=`<audio src="${escAttr(url)}" controls></audio>`;
  else {
    let text='';
    try{text=await (await fetch(url)).text();}catch{ text='امکان خواندن محتوای متنی این فایل وجود ندارد.'; }
    content=`<pre class="file-viewer-text">${escHtml(text)}</pre>`;
  }
  const viewer=document.createElement('div');
  viewer.id='saminFileViewer'; viewer.className='file-viewer-backdrop'; viewer.dataset.objectUrl=url;
  const tools=isImage?`<div class="file-viewer-tools"><button type="button" class="btn-icon" id="viewerZoomOut" title="کوچک‌نمایی">−</button><span class="file-viewer-zoom-label">100٪</span><button type="button" class="btn-icon" id="viewerZoomIn" title="بزرگ‌نمایی">+</button><button type="button" class="btn-icon" id="viewerZoomReset" title="بازنشانی زوم">1:1</button>${imageIds.length>1?`<span class="file-viewer-image-count">${imageIds.indexOf(id)+1} از ${imageIds.length}</span>`:''}</div>`:'';
  viewer.innerHTML=`<div class="file-viewer" role="dialog" aria-modal="true"><div class="file-viewer-head"><div class="file-viewer-title">${escHtml(meta.name||'پیوست')}</div><div style="display:flex;align-items:center;gap:8px">${tools}<button type="button" class="btn-icon" id="closeSaminFileViewer" title="بستن">${icon('x')}</button></div></div><div class="file-viewer-body">${content}</div></div>`;
  viewer.addEventListener('click',e=>{if(e.target===viewer) closeFileViewer();});
  document.body.appendChild(viewer);
  document.getElementById('closeSaminFileViewer').onclick=closeFileViewer;
  if(isImage){
    document.getElementById('viewerZoomIn').onclick=()=>changeViewerZoom(.2);
    document.getElementById('viewerZoomOut').onclick=()=>changeViewerZoom(-.2);
    document.getElementById('viewerZoomReset').onclick=resetViewerZoom;
    document.getElementById('viewerPrev')?.addEventListener('click',e=>{e.stopPropagation();navigateViewerImage(-1);});
    document.getElementById('viewerNext')?.addEventListener('click',e=>{e.stopPropagation();navigateViewerImage(1);});
    wireViewerImageInteractions();
  }
  document.addEventListener('keydown',fileViewerKeyHandler,true);
}

/* ---------------- REMINDER ALARM ---------------- */
let reminderAlarmTimer=null;
let reminderAudioCtx=null;
let reminderRingTimer=null;
let reminderPending=[];
const REMINDER_GRACE_MS = 24 * 60 * 60 * 1000; // یادآوری‌هایی که تا ۲۴ ساعت پیش سررسید شده‌اند و آلارم نخورده‌اند هم اعلام می‌شوند
function unlockReminderAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    reminderAudioCtx ||= new AC();
    if(reminderAudioCtx.state==='suspended') reminderAudioCtx.resume().catch(()=>{});
  }catch{}
}
// مرورگرها بدون تعامل کاربر اجازهٔ پخش صدا نمی‌دهند؛ با اولین لمس/کلیک، صدا آماده می‌شود.
['pointerdown','keydown','touchstart'].forEach(ev=> document.addEventListener(ev, unlockReminderAudio, {capture:true, passive:true}));
function reminderAlarmBeep(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    unlockReminderAudio();
    const now=reminderAudioCtx.currentTime;
    [0,0.32,0.64,1.0,1.32].forEach(offset=>{
      const osc=reminderAudioCtx.createOscillator();
      const gain=reminderAudioCtx.createGain();
      osc.type='sine'; osc.frequency.value=880;
      gain.gain.setValueAtTime(0.0001,now+offset);
      gain.gain.exponentialRampToValueAtTime(0.35,now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.22);
      osc.connect(gain); gain.connect(reminderAudioCtx.destination);
      osc.start(now+offset); osc.stop(now+offset+0.24);
    });
  }catch{}
}
function startReminderRinging(){
  if(reminderRingTimer) return;
  let n=0;
  const ring=()=>{
    reminderAlarmBeep();
    try{ if(navigator.vibrate) navigator.vibrate([300,150,300]); }catch{}
    if(++n>=20) stopReminderRinging(); // حداکثر حدود ۷۰ ثانیه
  };
  ring();
  reminderRingTimer=setInterval(ring,3500);
}
function stopReminderRinging(){
  if(reminderRingTimer){ clearInterval(reminderRingTimer); reminderRingTimer=null; }
}
async function requestReminderNotificationPermission(){
  if(!('Notification' in window)) return 'unsupported';
  if(Notification.permission==='default'){
    try{ return await Notification.requestPermission(); }catch{ return 'denied'; }
  }
  return Notification.permission;
}
async function showReminderAlarmModal(){
  let overlay=document.getElementById('reminderAlarmOverlay');
  const items=(await Promise.all(reminderPending.map(id=>dbGet('reminders',id).catch(()=>null)))).filter(r=>r && !r.dismissed);
  reminderPending = items.map(r=>r.id);
  if(!items.length){ stopReminderRinging(); if(overlay) overlay.remove(); return; }
  if(!overlay){
    overlay=document.createElement('div'); overlay.id='reminderAlarmOverlay'; overlay.className='modal-overlay';
    document.body.appendChild(overlay); requestAnimationFrame(()=>overlay.classList.add('open'));
  }
  overlay.innerHTML=`<div class="modal" style="max-width:440px;">
    <div class="modal-head"><div class="modal-title">${icon('bell')} یادآوری سررسید شد</div></div>
    <div class="modal-body">${items.map(r=>`<div style="padding:10px 0; border-bottom:1px solid var(--border-soft);">
      <div style="font-weight:700;">${escHtml(r.title||'بدون عنوان')}</div>
      <div class="faint" style="font-size:12px; margin:2px 0 8px;">${escHtml(reminderWhenFa(r))}</div>
      <div class="row" style="gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" data-ra-done="${r.id}">مشاهده شد</button>
        <button class="btn btn-ghost btn-sm" data-ra-snooze="${r.id}">۱۰ دقیقه بعد</button>
      </div></div>`).join('')}</div>
    <div class="modal-foot"><button class="btn btn-ghost" id="raMute">قطع صدا</button></div>
  </div>`;
  overlay.querySelector('#raMute').onclick=()=>stopReminderRinging();
  overlay.querySelectorAll('[data-ra-done]').forEach(b=> b.onclick=async ()=>{
    const rem=await dbGet('reminders',b.dataset.raDone).catch(()=>null);
    if(rem){ rem.dismissed=true; await dbPut('reminders',rem); }
    reminderPending=reminderPending.filter(x=>x!==b.dataset.raDone);
    if(!reminderPending.length) stopReminderRinging();
    showReminderAlarmModal();
  });
  overlay.querySelectorAll('[data-ra-snooze]').forEach(b=> b.onclick=async ()=>{
    const rem=await dbGet('reminders',b.dataset.raSnooze).catch(()=>null);
    if(rem){
      const d=new Date(Date.now()+10*60*1000);
      rem.dueAtIso=d.toISOString(); rem.dueAtFa=fmtJalaliFull(d);
      rem.dueAlarmAt=null; rem.alarmTriggeredAt=null; rem.dismissed=false;
      await dbPut('reminders',rem);
    }
    reminderPending=reminderPending.filter(x=>x!==b.dataset.raSnooze);
    if(!reminderPending.length) stopReminderRinging();
    toast('یادآوری ۱۰ دقیقه بعد دوباره اعلام می‌شود','info');
    showReminderAlarmModal();
  });
  startReminderRinging();
}
async function checkReminderAlarms(){
  if(!state.currentUser) return;
  const now=Date.now();
  let due=[];
  try{
    due=await dbGetAll('reminders',r=>{
      if(r.ownerUserId!==state.currentUser.id || r.dismissed || r.dueAlarmAt) return false;
      const t=new Date(r.dueAtIso).getTime();
      return !isNaN(t) && t<=now && (now-t)<=REMINDER_GRACE_MS;
    });
  }catch{ return; }
  if(!due.length) return;
  for(const rem of due){
    rem.dueAlarmAt=new Date().toISOString();
    rem.alarmTriggeredAt=rem.dueAlarmAt; rem.alarmTriggeredFor='due';
    await dbPut('reminders',rem);
    if(!reminderPending.includes(rem.id)) reminderPending.push(rem.id);
    if('Notification' in window && Notification.permission==='granted'){
      try{
        new Notification('یادآوری سامین',{
          body:`${rem.title||'یادآوری'}\n${reminderWhenFa(rem)}`,
          tag:`samin-reminder-${rem.id}`,
          requireInteraction:true
        });
      }catch{}
    }
  }
  showReminderAlarmModal();
}
function startReminderAlarm(){
  if(reminderAlarmTimer) clearInterval(reminderAlarmTimer);
  // در تمام صفحاتِ بعد از ورود به حساب فعال است؛ وابسته به صفحه یا منوی فعلی نیست.
  reminderAlarmTimer=setInterval(checkReminderAlarms,5000);
  checkReminderAlarms();
  document.removeEventListener('visibilitychange', checkReminderAlarms);
  document.addEventListener('visibilitychange', checkReminderAlarms);
}
function stopReminderAlarm(){
  if(reminderAlarmTimer) clearInterval(reminderAlarmTimer);
  reminderAlarmTimer=null;
  document.removeEventListener('visibilitychange', checkReminderAlarms);
  stopReminderRinging(); reminderPending=[];
  document.getElementById('reminderAlarmOverlay')?.remove();
}

/* ---- generic status change / trash ---- */
async function applyTransactionEffect(tx){
  if(!tx.bankAccountId) return;
  const acc = await dbGet('bankAccounts', tx.bankAccountId).catch(()=>null);
  if(!acc) return;
  const delta = tx.txType==='income' ? (tx.amount||0) : -(tx.amount||0);
  acc.balance = (acc.balance||0) + delta;
  await dbPut('bankAccounts', acc);
}
async function reverseTransactionEffect(tx){
  if(!tx.bankAccountId) return;
  const acc = await dbGet('bankAccounts', tx.bankAccountId).catch(()=>null);
  if(!acc) return;
  const delta = tx.txType==='income' ? (tx.amount||0) : -(tx.amount||0);
  acc.balance = (acc.balance||0) - delta;
  await dbPut('bankAccounts', acc);
}
async function applyTransferEffect(tr){
  const from = await dbGet('bankAccounts', tr.fromAccountId).catch(()=>null);
  const to = await dbGet('bankAccounts', tr.toAccountId).catch(()=>null);
  if(from){ from.balance = (from.balance||0) - (tr.amount||0); await dbPut('bankAccounts', from); }
  if(to){ to.balance = (to.balance||0) + (tr.amount||0); await dbPut('bankAccounts', to); }
}
async function reverseTransferEffect(tr){
  const from = await dbGet('bankAccounts', tr.fromAccountId).catch(()=>null);
  const to = await dbGet('bankAccounts', tr.toAccountId).catch(()=>null);
  if(from){ from.balance = (from.balance||0) + (tr.amount||0); await dbPut('bankAccounts', from); }
  if(to){ to.balance = (to.balance||0) - (tr.amount||0); await dbPut('bankAccounts', to); }
}
async function setStatus(storeName, id, status){
  const rec = await dbGet(storeName, id);
  if(!rec) return;
  const oldStatus = rec.status;
  if(storeName==='transactions'){
    if(oldStatus!=='TRASHED' && status==='TRASHED') await reverseTransactionEffect(rec);
    else if(oldStatus==='TRASHED' && status!=='TRASHED') await applyTransactionEffect(rec);
  }
  if(storeName==='transfers'){
    if(oldStatus!=='TRASHED' && status==='TRASHED') await reverseTransferEffect(rec);
    else if(oldStatus==='TRASHED' && status!=='TRASHED') await applyTransferEffect(rec);
  }
  rec.status = status; rec.updatedAt = new Date().toISOString();
  await dbPut(storeName, rec);
}

async function drawContactsList(){
  let list = await dbGetAll('contacts', c=>c.ownerUserId===state.currentUser.id && c.status!=='TRASHED');
  if(contactsUI.search){
    const q = contactsUI.search.toLowerCase();
    list = list.filter(c=> (c.fullName||'').toLowerCase().includes(q) || (c.mobile||'').includes(q) || (c.email||'').toLowerCase().includes(q));
  }
  if(contactsUI.sort==='name_asc') list.sort((a,b)=>(a.fullName||'').localeCompare(b.fullName||'','fa'));
  if(contactsUI.sort==='name_desc') list.sort((a,b)=>(b.fullName||'').localeCompare(a.fullName||'','fa'));
  if(contactsUI.sort==='newest') list.sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));

  const tbody = document.getElementById('contactsTbody');
  if(!list.length){
    tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state">${icon('contact')}<div class="msg">هنوز مخاطبی ثبت نشده است</div><div class="sub">از فرم بالا برای افزودن مخاطب جدید استفاده کنید</div></div></td></tr>`;
    document.getElementById('contactsSelectAllRow').innerHTML=''; document.getElementById('contactsBulkBar').innerHTML='';
    return;
  }
  tbody.innerHTML = list.map(c=>`
    <tr data-row="${c.id}">
      <td><input type="checkbox" data-sel="${c.id}" ${contactsUI.selected.has(c.id)?'checked':''}></td>
      <td><div style="font-weight:600;">${escHtml(c.fullName)}</div>${c.email?`<div class="faint" style="font-size:11.5px;">${escHtml(c.email)}</div>`:''}</td>
      <td class="mono-num">${escHtml(c.mobile)||'—'}</td>
      <td>${c.category?`<span class="badge neutral">${escHtml(c.category)}</span>`:'—'}</td>
      <td>${c.status==='ARCHIVED'?'<span class="badge neutral">بایگانی</span>':'<span class="badge success">فعال</span>'}</td>
      <td><div class="row" style="justify-content:flex-end;">
        <button class="btn-icon" data-edit="${c.id}" title="ویرایش">${icon('edit')}</button>
        <button class="btn-icon" data-archive="${c.id}" title="بایگانی">${icon('archive')}</button>
        <button class="btn-icon" data-trash="${c.id}" title="حذف">${icon('trash')}</button>
      </div></td>
    </tr>`).join('');

  document.getElementById('contactsSelectAllRow').innerHTML = `<input type="checkbox" id="cSelectAll"><label for="cSelectAll" class="faint" style="font-size:12.5px;">انتخاب همه (${list.length.toLocaleString('fa-IR')})</label>`;
  document.getElementById('cSelectAll').onchange = (e)=>{
    list.forEach(c=> e.target.checked ? contactsUI.selected.add(c.id) : contactsUI.selected.delete(c.id));
    drawContactsList();
  };
  document.getElementById('contactsBulkBar').innerHTML = bulkBar(contactsUI.selected.size, [
    {key:'archive', label:'بایگانی گروهی'}, {key:'trash', label:'حذف گروهی', danger:true}
  ]);
  document.querySelectorAll('#contactsBulkBar [data-bulk]').forEach(b=>{
    b.onclick = async ()=>{
      const ids=[...contactsUI.selected];
      if(b.dataset.bulk==='archive'){ for(const id of ids) await setStatus('contacts', id, 'ARCHIVED'); toast('موارد انتخابی بایگانی شدند','success'); }
      if(b.dataset.bulk==='trash'){
        const ok = await confirmModal({title:'حذف گروهی', body:`${ids.length} مخاطب به سطل زباله منتقل می‌شود. ادامه می‌دهید؟`, confirmLabel:'انتقال به زباله', danger:true});
        if(!ok) return;
        for(const id of ids) await setStatus('contacts', id, 'TRASHED');
        toast('موارد انتخابی به سطل زباله منتقل شدند','success');
      }
      contactsUI.selected.clear(); drawContactsList();
    };
  });
  tbody.querySelectorAll('[data-sel]').forEach(cb=> cb.onchange = ()=>{ cb.checked ? contactsUI.selected.add(cb.dataset.sel) : contactsUI.selected.delete(cb.dataset.sel); drawContactsList(); });
  tbody.querySelectorAll('[data-edit]').forEach(b=> b.onclick = async ()=>{
    const rec = await dbGet('contacts', b.dataset.edit);
    contactsUI.editId = rec.id;
    const banks = await getLookup('banks', []); const cats = await getLookup('contactCategories', []);
    renderContactForm(banks.options, cats.options, rec);
    openAccordion('contactAcc');
    document.getElementById('contactAcc').scrollIntoView({behavior:'smooth', block:'start'});
  });
  tbody.querySelectorAll('[data-archive]').forEach(b=> b.onclick = async ()=>{ await setStatus('contacts', b.dataset.archive, 'ARCHIVED'); toast('مخاطب بایگانی شد','success'); drawContactsList(); });
  tbody.querySelectorAll('[data-trash]').forEach(b=> b.onclick = async ()=>{
    const ok = await confirmModal({title:'حذف مخاطب', body:'مخاطب به سطل زباله منتقل می‌شود.', confirmLabel:'انتقال به زباله', danger:true});
    if(!ok) return;
    await setStatus('contacts', b.dataset.trash, 'TRASHED');
    await logActivity(state.currentUser.id, 'DELETE', 'انتقال مخاطب به سطل زباله');
    toast('مخاطب به سطل زباله منتقل شد','success'); drawContactsList();
  });
}

    if(!ok){ document.getElementById('vaultErr').innerHTML = `<div class="login-error">${icon('x')}<span>رمز عبور نادرست است.</span></div>`; return; }

async function unlockOrInitVault(accountPassword){
  let settings = (await dbGetAll('userSettings', s=>s.ownerUserId===state.currentUser.id))[0];
  if(!settings){ settings = { id:uuid(), ownerUserId:state.currentUser.id }; }
  if(!settings.vaultKeyWrapped){
    const rawKey = crypto.getRandomValues(new Uint8Array(32));
    const vaultKeySalt = randHex(16);
    const wrapKey = await deriveAesKey(accountPassword, vaultKeySalt);
    const rawKeyHex = bufToHex(rawKey.buffer);
    const wrapped = await aesEncrypt(rawKeyHex, wrapKey);
    settings.vaultKeySalt = vaultKeySalt; settings.vaultKeyWrapped = wrapped;
    await dbPut('userSettings', settings);
    state.vaultKey = await crypto.subtle.importKey('raw', hexToBuf(rawKeyHex), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  } else {
    const wrapKey = await deriveAesKey(accountPassword, settings.vaultKeySalt);
    const rawKeyHex = await aesDecrypt(settings.vaultKeyWrapped, wrapKey);
    state.vaultKey = await crypto.subtle.importKey('raw', hexToBuf(rawKeyHex), {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  }
}

const AT_STORES = ['contacts','documents','passwordEntries','bankAccounts','transactions','transfers','projects','tasks','notes','vehicles','customRecords','fileMetadata'];
async function collectByStatus(status){
  const out = [];
  for(const s of AT_STORES){
    const items = await dbGetAll(s, r=>r.ownerUserId===state.currentUser.id && r.status===status);
    items.forEach(i=> out.push({ store:s, rec:i }));
  }
  out.sort((a,b)=> new Date(b.rec.updatedAt||b.rec.createdAt) - new Date(a.rec.updatedAt||a.rec.createdAt));
  return out;
}
async function restoreRecord(store, id){ return setStatus(store, id, 'ACTIVE'); }
async function trashRecord(store, id){ return setStatus(store, id, 'TRASHED'); }
async function permanentDeleteRecord(store, id){
  const rec = await dbGet(store, id);
  if(rec && rec.status!=='TRASHED'){
    if(store==='transactions') await reverseTransactionEffect(rec);
    if(store==='transfers') await reverseTransferEffect(rec);
  }
  return dbDelete(store, id);
}

  render_currentPage = ()=>renderTrashPage(el);
  const items = await collectByStatus('TRASHED');
  el.innerHTML = `
    <div class="page-header"><div><div class="page-title">سطل زباله</div><div class="page-sub">موارد حذف‌شده تا حذف دائمی این‌جا نگهداری می‌شوند</div></div></div>
    <div class="card card-pad">
      ${!items.length? `<div class="empty-state">${icon('trash')}<div class="msg">سطل زباله خالی است</div></div>` : `
      <div class="select-all-row"><input type="checkbox" id="tSelectAll"><label for="tSelectAll" class="faint" style="font-size:12.5px;">انتخاب همه (${items.length.toLocaleString('fa-IR')})</label></div>
      <div id="trashBulkBar"></div>
      <div class="table-wrap"><table><thead><tr><th></th><th>بخش</th><th>عنوان</th><th></th></tr></thead><tbody>
        ${items.map(it=>`<tr>
          <td><input type="checkbox" data-sel="${it.store}:${it.rec.id}" ${trashSelected.has(it.store+':'+it.rec.id)?'checked':''}></td>
          <td><span class="badge neutral">${MODULE_META[it.store].label}</span></td>
          <td>${escHtml(MODULE_META[it.store].displayName(it.rec))}</td>
          <td><div class="row" style="justify-content:flex-end;">
            <button class="btn btn-sm btn-ghost" data-restore="${it.store}:${it.rec.id}">بازگردانی</button>
            <button class="btn-icon" data-perm="${it.store}:${it.rec.id}" title="حذف دائمی">${icon('x')}</button>
          </div></td>
        </tr>`).join('')}
      </tbody></table></div>`}
    </div>`;
  if(!items.length) return;
  document.getElementById('tSelectAll').onchange = (e)=>{
    items.forEach(it=>{ const key=it.store+':'+it.rec.id; e.target.checked?trashSelected.add(key):trashSelected.delete(key); });
    renderTrashPage(el);
  };
  document.getElementById('trashBulkBar').innerHTML = bulkBar(trashSelected.size, [{key:'restore',label:'بازگردانی گروهی'},{key:'perm',label:'حذف دائمی گروهی',danger:true}]);
  document.querySelectorAll('#trashBulkBar [data-bulk]').forEach(b=> b.onclick = async ()=>{
    const keys=[...trashSelected];
    if(b.dataset.bulk==='restore'){ for(const k of keys){ const [s,id]=k.split(':'); await restoreRecord(s, id); } toast('بازگردانی شد','success'); }
    if(b.dataset.bulk==='perm'){
      const ok = await confirmModal({title:'حذف دائمی گروهی', body:`${keys.length} مورد برای همیشه حذف می‌شود. این عملیات قابل بازگشت نیست.`, confirmLabel:'حذف دائمی', danger:true});
      if(!ok) return;
      for(const k of keys){ const [s,id]=k.split(':'); await permanentDeleteRecord(s, id); }
      await logActivity(state.currentUser.id, 'DELETE', `حذف دائمی گروهی (${keys.length} مورد)`);
      toast('حذف دائمی انجام شد','success');
    }
    trashSelected.clear(); renderTrashPage(el);
  });
  el.querySelectorAll('[data-sel]').forEach(cb=> cb.onchange = ()=>{ cb.checked?trashSelected.add(cb.dataset.sel):trashSelected.delete(cb.dataset.sel); renderTrashPage(el); });
  el.querySelectorAll('[data-restore]').forEach(b=> b.onclick = async ()=>{ const [s,id]=b.dataset.restore.split(':'); await restoreRecord(s, id); toast('بازگردانی شد','success'); renderTrashPage(el); });
  el.querySelectorAll('[data-perm]').forEach(b=> b.onclick = async ()=>{
    const [s,id]=b.dataset.perm.split(':');
    const ok = await confirmModal({title:'حذف دائمی', body:'این مورد برای همیشه حذف می‌شود و قابل بازگشت نیست.', confirmLabel:'حذف دائمی', danger:true});
    if(!ok) return;
    await permanentDeleteRecord(s, id);
    await logActivity(state.currentUser.id, 'DELETE', `حذف دائمی از ${MODULE_META[s].label}`);
    toast('حذف دائمی انجام شد','success'); renderTrashPage(el);
  });
}

let tripUI={view:'list', currentTripId:null};

async function renderHamSafarPage(el){

    <div class="page-header"><div><div class="page-title">همسفر</div><div class="page-sub">محاسبه سهم هر نفر، پرداخت‌ها و تسویه حساب سفر</div></div>

async function renderTripDetail(el,tripId){
  const trip=await dbGet('travelTrips',tripId);
  if(!trip || trip.ownerUserId!==state.currentUser.id || trip.status==='TRASHED'){tripUI.view='list';return renderHamSafarPage(el);}
  const people=await dbGetAll('travelPeople',p=>p.ownerUserId===state.currentUser.id && p.tripId===tripId && p.status!=='TRASHED');
  const expenses=await dbGetAll('travelExpenses',x=>x.ownerUserId===state.currentUser.id && x.tripId===tripId && x.status!=='TRASHED');
  const pmap=Object.fromEntries(people.map(p=>[p.id,p]));
  const total=expenses.reduce((s,x)=>s+Number(x.amount||0),0);
  const paid=Object.fromEntries(people.map(p=>[p.id,0]));
  const share=Object.fromEntries(people.map(p=>[p.id,0]));
  expenses.forEach(x=>{
    if(paid[x.payerId]!=null) paid[x.payerId]+=Number(x.amount||0);
    const ids=(x.participantIds||people.map(p=>p.id)).filter(id=>share[id]!=null);
    const each=ids.length?Number(x.amount||0)/ids.length:0;
    ids.forEach(id=>share[id]+=each);
  });
  const net=Object.fromEntries(people.map(p=>[p.id,(paid[p.id]||0)-(share[p.id]||0)]));
  const debtors=people.filter(p=>net[p.id]<-0.005).map(p=>({id:p.id,name:p.name,amount:-net[p.id]}));
  const creditors=people.filter(p=>net[p.id]>0.005).map(p=>({id:p.id,name:p.name,amount:net[p.id]}));
  const settlements=[]; let di=0,ci=0;
  while(di<debtors.length&&ci<creditors.length){
    const amount=Math.min(debtors[di].amount,creditors[ci].amount);
    settlements.push({from:debtors[di].name,to:creditors[ci].name,amount});
    debtors[di].amount-=amount; creditors[ci].amount-=amount;
    if(debtors[di].amount<0.01)di++; if(creditors[ci].amount<0.01)ci++;
  }
  el.innerHTML=`
    <div class="breadcrumb"><button id="tripBack">${icon('back')} همسفر</button><span>/</span><span>${escHtml(trip.name)}</span></div>
    <div class="page-header"><div><div class="page-title">${escHtml(trip.name)}</div><div class="page-sub">مجموع هزینه: ${total.toLocaleString('fa-IR')} تومان</div></div>
      <button class="btn btn-ghost" id="editTripName">${icon('edit')} تغییر نام</button>
    </div>
    <div class="two-col">
      <div class="card card-pad">
        <div class="section-label">${icon('users')} افراد سفر</div>
        <div id="peopleList">${people.map(p=>`<div class="trip-person-row"><input value="${escAttr(p.name)}" data-person-name="${p.id}"><button class="btn-icon" data-person-del="${p.id}" title="حذف">${icon('x')}</button></div>`).join('')}</div>
        <div class="row" style="margin-top:10px;"><input id="newPersonName" placeholder="نام فرد جدید" style="flex:1;height:40px;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:0 12px;"><button class="btn btn-primary btn-sm" id="addPersonBtn">${icon('plus')} افزودن</button></div>
      </div>
      <div class="card card-pad">
        <div class="section-label">${icon('wallet')} ثبت هزینه</div>
        <div class="field"><label>شرح هزینه</label><input id="expenseTitle" placeholder="مثلاً شام"></div>
        <div class="two-col">
          <div class="field"><label>مبلغ (تومان) *</label><input type="number" id="expenseAmount" min="0"></div>
          <div class="field"><label>پرداخت‌کننده</label><select id="expensePayer">${people.map(p=>`<option value="${p.id}">${escHtml(p.name)}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>سهم این هزینه بین چه کسانی تقسیم شود؟</label>
          <div class="row" style="flex-wrap:wrap;gap:8px;">${people.map(p=>`<label class="badge neutral" style="cursor:pointer;"><input type="checkbox" data-split-person="${p.id}" checked> ${escHtml(p.name)}</label>`).join('')}</div>
        </div>
        <button class="btn btn-primary" id="addExpenseBtn" ${people.length<1?'disabled':''}>${icon('check')} ثبت هزینه</button>
      </div>
    </div>
    <div class="card card-pad" style="margin-top:var(--sp-4);">
      <div class="section-label">${icon('activity')} وضعیت حساب افراد</div>
      <div class="table-wrap"><table><thead><tr><th>فرد</th><th>پرداخت کرده</th><th>سهم واقعی</th><th>مانده</th></tr></thead><tbody>
      ${people.map(p=>{const n=net[p.id]||0;return `<tr><td>${escHtml(p.name)}</td><td>${paid[p.id].toLocaleString('fa-IR')}</td><td>${share[p.id].toLocaleString('fa-IR')}</td><td><span class="badge ${n>0.005?'success':n<-0.005?'danger':'neutral'}">${n>0.005?'طلبکار':n<-0.005?'بدهکار':'تسویه'} ${Math.abs(n).toLocaleString('fa-IR')} تومان</span></td></tr>`}).join('')}
      </tbody></table></div>
    </div>
    <div class="card card-pad" style="margin-top:var(--sp-4);">
      <div class="row between" style="margin-bottom:10px;"><strong>هزینه‌های ثبت‌شده</strong><span class="badge neutral">${expenses.length.toLocaleString('fa-IR')} مورد</span></div>
      ${expenses.length?expenses.map(x=>`<div class="trip-expense-row"><div>${escHtml(x.title||'هزینه')}</div><div>${escHtml(pmap[x.payerId]?.name||'—')}</div><div>${Number(x.amount||0).toLocaleString('fa-IR')} تومان</div><button class="btn-icon" data-expense-del="${x.id}" title="حذف">${icon('trash')}</button></div>`).join(''):'<div class="empty-state" style="padding:25px;">هنوز هزینه‌ای ثبت نشده است</div>'}
    </div>
    <div class="card card-pad" style="margin-top:var(--sp-4);">
      <div class="section-label">${icon('check')} تسویه حساب پیشنهادی</div>
      ${settlements.length?settlements.map(s=>`<div class="trip-balance-card row between" style="margin-bottom:8px;"><span><strong>${escHtml(s.from)}</strong> به <strong>${escHtml(s.to)}</strong></span><span class="badge gold">${s.amount.toLocaleString('fa-IR')} تومان</span></div>`).join(''):'<div class="muted">با اطلاعات فعلی، بدهی معوقی برای تسویه وجود ندارد.</div>'}
    </div>`;
  document.getElementById('tripBack').onclick=()=>{tripUI.view='list';tripUI.currentTripId=null;renderHamSafarPage(el);};
  document.getElementById('editTripName').onclick=async()=>{
    const name=prompt('نام جدید سفر:',trip.name); if(!name?.trim())return; trip.name=name.trim();trip.updatedAt=new Date().toISOString();await dbPut('travelTrips',trip);renderTripDetail(el,tripId);
  };
  document.getElementById('addPersonBtn').onclick=async()=>{
    const name=document.getElementById('newPersonName').value.trim();if(!name){toast('نام فرد را وارد کنید','error');return;}
    await dbPut('travelPeople',{id:uuid(),ownerUserId:state.currentUser.id,tripId,name,status:'ACTIVE',createdAt:new Date().toISOString()});renderTripDetail(el,tripId);
  };
  el.querySelectorAll('[data-person-name]').forEach(inp=>inp.onchange=async()=>{const p=await dbGet('travelPeople',inp.dataset.personName);if(!p)return;p.name=inp.value.trim()||p.name;await dbPut('travelPeople',p);});
  el.querySelectorAll('[data-person-del]').forEach(b=>b.onclick=async()=>{const ok=await confirmModal({title:'حذف فرد',body:'این فرد از فهرست افراد این سفر حذف می‌شود. هزینه‌های قبلی او برای حفظ محاسبات باقی می‌مانند.',confirmLabel:'حذف',danger:true});if(!ok)return;const p=await dbGet('travelPeople',b.dataset.personDel);p.status='TRASHED';await dbPut('travelPeople',p);renderTripDetail(el,tripId);});
  document.getElementById('addExpenseBtn').onclick=async()=>{
    const amount=Number(document.getElementById('expenseAmount').value);const payerId=document.getElementById('expensePayer').value;
    const participantIds=[...el.querySelectorAll('[data-split-person]:checked')].map(x=>x.dataset.splitPerson);
    if(!amount||amount<=0){toast('مبلغ معتبر وارد کنید','error');return;}
    if(!payerId||!participantIds.length){toast('پرداخت‌کننده و حداقل یک نفر برای تقسیم سهم لازم است','error');return;}
    await dbPut('travelExpenses',{id:uuid(),ownerUserId:state.currentUser.id,tripId,title:document.getElementById('expenseTitle').value.trim()||'هزینه',amount,payerId,participantIds,status:'ACTIVE',createdAt:new Date().toISOString()});
    renderTripDetail(el,tripId);
  };
  el.querySelectorAll('[data-expense-del]').forEach(b=>b.onclick=async()=>{const ok=await confirmModal({title:'حذف هزینه',body:'این هزینه از محاسبات سفر حذف می‌شود.',confirmLabel:'حذف',danger:true});if(!ok)return;const x=await dbGet('travelExpenses',b.dataset.expenseDel);x.status='TRASHED';await dbPut('travelExpenses',x);renderTripDetail(el,tripId);});
}

const DAILY_PLAN_KEY = 'samin_daily_plan_v1';
function dailyPlanDateKey(date=new Date()){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}
function dailyPlanShiftDate(key, delta){
  const [y,m,d]=key.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+delta); return dailyPlanDateKey(dt);
}
function dailyPlanStore(){
  const uid=state.currentUser?.id||'guest';
  const raw=lsGet(`${DAILY_PLAN_KEY}_${uid}`);
  try{ const x=raw?JSON.parse(raw):null; return x&&x.days?x:{days:{},lastProcessed:null}; }catch{return {days:{},lastProcessed:null};}
}
function saveDailyPlanStore(store){ const uid=state.currentUser?.id||'guest'; lsSet(`${DAILY_PLAN_KEY}_${uid}`,JSON.stringify(store)); }
function normalizeDailyPlan(){
  const store=dailyPlanStore(); const today=dailyPlanDateKey();
  if(!store.lastProcessed){ store.lastProcessed=today; saveDailyPlanStore(store); return store; }
  if(store.lastProcessed===today) return store;
  let cursor=store.lastProcessed;
  while(cursor!==today){
    const next=dailyPlanShiftDate(cursor,1);
    const pending=(store.days[cursor]||[]).filter(x=>!x.done);
    if(pending.length){
      const nextItems=store.days[next]||[];
      for(const item of pending){
        if(!nextItems.some(x=>x.sourceId===item.id || (x.text===item.text && !x.done))) nextItems.push({...item,id:uuid(),sourceId:item.id,done:false,carried:true});
      }
      store.days[next]=nextItems;
      store.days[cursor]=(store.days[cursor]||[]).filter(x=>x.done);
    }
    cursor=next;
  }
  store.lastProcessed=today; saveDailyPlanStore(store); return store;
}
function dailyPlanDisplayDate(){
  const d=new Date();
  return fmtJalali(d,false);
}
async function renderDailyPlan(el){
  const store=normalizeDailyPlan(); const today=dailyPlanDateKey(); const items=store.days[today]||[];
  const pending=items.filter(x=>!x.done).length;
  el.innerHTML=`
    <div class="card daily-plan">
      <div class="daily-plan-head">
        <div><div class="daily-plan-title">${icon('check')} لیست کارهای روزانه</div><div class="daily-plan-date">${dailyPlanDisplayDate()} · ${pending.toLocaleString('fa-IR')} کار باقی‌مانده</div></div>
        <span class="badge ${pending?'gold':'neutral'}">${pending?'در حال انجام':'تکمیل‌شده'}</span>
      </div>
      ${items.length?`<div class="daily-plan-grid">${items.map(item=>`<div class="daily-plan-item ${item.done?'done':''}" data-daily-id="${item.id}">
        <button type="button" class="daily-plan-remove" data-daily-remove="${item.id}" title="حذف">${icon('x')}</button>
        <label class="daily-plan-check" data-daily-check title="${item.done?'علامت انجام‌شده را بردارید':'علامت انجام‌شده بزنید'}" onclick="event.stopPropagation()">
          <input type="checkbox" class="daily-plan-toggle" data-daily-toggle="${item.id}" ${item.done?'checked':''} aria-label="${item.done?'علامت انجام‌شده را بردارید':'علامت انجام‌شده بزنید'}">
        </label>
        <div class="daily-plan-text">${escHtml(item.text)}</div>
      </div>`).join('')}</div>`:`<div class="daily-plan-empty">هنوز کاری برای امروز ثبت نشده است.</div>`}
      <div class="daily-plan-add"><div class="field"><label for="dailyPlanInput">کار روزمره جدید</label><input id="dailyPlanInput" type="text" maxlength="120" placeholder="عنوان کار را وارد کنید…"></div><button class="btn btn-primary" id="dailyPlanAddBtn">${icon('plus')} افزودن</button></div>
    </div>`;
  const toggle=async(id)=>{ const st=normalizeDailyPlan(); const arr=st.days[today]||[]; const item=arr.find(x=>x.id===id); if(!item)return; item.done=!item.done; saveDailyPlanStore(st); await renderDailyPlan(el); };
  el.querySelectorAll('[data-daily-toggle]').forEach(cb=>cb.onchange=async e=>{ e.stopPropagation(); await toggle(cb.dataset.dailyToggle); });
  el.querySelectorAll('[data-daily-id]').forEach(card=>card.onclick=e=>{ if(e.target.closest('[data-daily-remove],[data-daily-check]')) return; toggle(card.dataset.dailyId); });
  el.querySelectorAll('[data-daily-remove]').forEach(btn=>btn.onclick=async e=>{ e.stopPropagation(); const st=normalizeDailyPlan(); st.days[today]=(st.days[today]||[]).filter(x=>x.id!==btn.dataset.dailyRemove); saveDailyPlanStore(st); await renderDailyPlan(el); });
  const add=async()=>{ const inp=document.getElementById('dailyPlanInput'); const text=inp.value.trim(); if(!text){toast('عنوان کار را وارد کنید','error');return;} const st=normalizeDailyPlan(); (st.days[today] ||= []).push({id:uuid(),text,done:false,createdAt:new Date().toISOString()}); saveDailyPlanStore(st); await renderDailyPlan(el); setTimeout(()=>document.getElementById('dailyPlanInput')?.focus(),0); };
  document.getElementById('dailyPlanAddBtn').onclick=add;
  document.getElementById('dailyPlanInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add();}};
}

  overlay.innerHTML = `<div class="modal"><div class="modal-head"><div class="modal-title">مدیریت انواع فعالیت</div></div>${body()}<div class="modal-foot"><button class="btn btn-ghost" id="jtClose">بستن</button></div></div>`;
  document.body.appendChild(overlay); requestAnimationFrame(()=>overlay.classList.add('open'));
  function rewire(){
    overlay.querySelector('#jtAddField').onclick = ()=>{ builderFields.push({label:'',type:'text'}); overlay.querySelector('.modal-body').outerHTML=body(); rewire(); };
    overlay.querySelector('#jtName').oninput = e=>{ builderName=e.target.value; };
    overlay.querySelectorAll('[data-fbf]').forEach(inp=> inp.oninput = ()=>{ builderFields[+inp.dataset.fbf].label = inp.value; });
    overlay.querySelectorAll('[data-fbt]').forEach(sel=> sel.onchange = ()=>{ builderFields[+sel.dataset.fbt].type = sel.value; });
    overlay.querySelector('#jtAddField').onclick = ()=>{
      builderName = overlay.querySelector('#jtName')?.value || builderName;
      const newIndex = builderFields.length;
      builderFields.push({label:'',type:'text'});
      overlay.querySelector('.modal-body').outerHTML=body();
      rewire();
      requestAnimationFrame(()=>{
        const newInput = overlay.querySelector(`[data-fbf="${newIndex}"]`);
        if(newInput){ newInput.focus({preventScroll:true}); newInput.setSelectionRange(newInput.value.length,newInput.value.length); }
      });
    };
    overlay.querySelectorAll('[data-fbrm]').forEach(b=> b.onclick = ()=>{
      builderName = overlay.querySelector('#jtName')?.value || builderName;
      builderFields.splice(+b.dataset.fbrm,1);
      overlay.querySelector('.modal-body').outerHTML=body();
      rewire();
    });
    overlay.querySelector('#jtSave').onclick = async ()=>{
      const name = (overlay.querySelector('#jtName')?.value || builderName).trim();
      builderName = name;
      if(!name){ toast('نام نوع فعالیت الزامی است','error'); return; }
      const fields = builderFields.filter(f=>f.label.trim()).map(f=>({ key:'f_'+randHex(4), label:f.label.trim(), type:f.type }));
      await dbPut('jobTypes', { id:uuid(), ownerUserId:state.currentUser.id, name, fields });
      list.push({name, fields}); builderFields=[];
      overlay.querySelector('.modal-body').outerHTML=body(); rewire();
      toast('نوع فعالیت ثبت شد','success');
    };
    overlay.querySelectorAll('[data-jtrm]').forEach(b=> b.onclick = async ()=>{ await dbDelete('jobTypes', b.dataset.jtrm); overlay.querySelector('.modal-body').outerHTML=body(); rewire(); });
  }
  rewire();
  overlay.querySelector('#jtClose').onclick = ()=>{ overlay.classList.remove('open'); setTimeout(()=>overlay.remove(),200); render_currentPage && render_currentPage(); };
}

  function readProjectFormValues(){
    const values = {...(f.customValues||{})};
    document.querySelectorAll('#projDynamicFields [data-dyn]').forEach(inp=>{
      values[inp.dataset.dyn] = inp.type==='number' ? (inp.value==='' ? '' : (parseFloat(inp.value)||0)) : inp.value;
    });
    (document.querySelectorAll('#projDynamicFields [data-jcal-prefix]')||[]).forEach(w=>{
      const pre=w.dataset.jcalPrefix; const key=pre.replace(/^dyn_/,''); values[key]=readJalaliDateSelect(pre).fa;
    });
    return values;
  }
  function paintDynamic(){
    const oldValues = readProjectFormValues();
    const jt = jobTypes.find(j=>j.id===document.getElementById('projJobType').value);
    const cv = {...(f.customValues||{}), ...oldValues};
    document.getElementById('projDynamicFields').innerHTML = jt && jt.fields.length ? `

        if(fld.type==='date') return `<div class="field"><label>${escHtml(fld.label)}</label>${jalaliDateSelectHtml('dyn_'+fld.key, cv[fld.key])}</div>`;
        return `<div class="field"><label>${escHtml(fld.label)}</label><input type="${fld.type==='number'?'number':'text'}" data-dyn="${fld.key}" value="${escAttr(cv[fld.key] ?? '')}"></div>`;
      }).join('')}</div>` : '';
    const nameEl=document.getElementById('projName');
    if(nameEl) nameEl.value = document.getElementById('projName')?.value ?? (f.name||'');
    requestAnimationFrame(()=>document.getElementById('projAcc')?.dispatchEvent(new Event('samin:resize')));
  }
  document.getElementById('projJobType').onchange = ()=>{
    const currentName=document.getElementById('projName')?.value || '';
    const currentValues=readProjectFormValues();
    f.name=currentName; f.customValues={...(f.customValues||{}),...currentValues};
    paintDynamic();
    const nameEl=document.getElementById('projName');
    if(nameEl) nameEl.value=currentName;
  };
  paintDynamic();
  document.getElementById('projSaveBtn').onclick = async ()=>{
    const name = document.getElementById('projName').value.trim();
    if(!name){ toast('نام پروژه الزامی است','error'); return; }
    const rec = editing? await dbGet('projects', editing.id) : { id:uuid(), ownerUserId:state.currentUser.id, status:'ACTIVE', createdAt:new Date().toISOString() };
    rec.jobTypeId = document.getElementById('projJobType').value;
    rec.name = name;
    rec.projectStage = document.getElementById('projStage').value;
    rec.customValues = {};
    document.querySelectorAll('#projDynamicFields [data-dyn]').forEach(inp=>{ rec.customValues[inp.dataset.dyn] = inp.type==='number'? parseFloat(inp.value)||0 : inp.value; });
    document.querySelectorAll('#projDynamicFields [data-jcal-prefix]').forEach(w=>{ const pre=w.dataset.jcalPrefix; rec.customValues[pre.replace(/^dyn_/,'')]=readJalaliDateSelect(pre).fa; });
    rec.updatedAt = new Date().toISOString();

async function drawTasksList(projectId){

  if(!list.length){ wrap.innerHTML = `<div class="empty-state">${icon('task')}<div class="msg">هنوز کاری برای این پروژه ثبت نشده است</div></div>`; document.getElementById('taskSelectAllRow').innerHTML=''; document.getElementById('taskBulkBar').innerHTML=''; return; }
  document.getElementById('taskSelectAllRow').innerHTML = `<input type="checkbox" id="taskSelectAll"><label for="taskSelectAll" class="faint" style="font-size:12.5px;">انتخاب همه (${list.length.toLocaleString('fa-IR')})</label>`;
  document.getElementById('taskSelectAll').onchange = e=>{ list.forEach(t=> e.target.checked?tasksUI.tSelected.add(t.id):tasksUI.tSelected.delete(t.id)); drawTasksList(projectId); };
  document.getElementById('taskBulkBar').innerHTML = bulkBar(tasksUI.tSelected.size, [{key:'trash',label:'حذف گروهی',danger:true}]);
  document.querySelectorAll('#taskBulkBar [data-bulk]').forEach(b=> b.onclick = async ()=>{
    const ids=[...tasksUI.tSelected];

    for(const id of ids) await setStatus('tasks', id, 'TRASHED');
    tasksUI.tSelected.clear(); drawTasksList(projectId); toast('انجام شد','success');
  });
  wrap.innerHTML = await Promise.all(list.map(async t=>{
    const subs = await dbGetAll('subTasks', s=>s.ownerUserId===state.currentUser.id && s.taskId===t.id);
    const doneCount = subs.filter(s=>s.done).length;
    return `<div class="card card-pad" style="margin-bottom:10px;" data-task="${t.id}">
      <div class="row between">
        <div class="row" style="gap:10px;"><input type="checkbox" data-tsel="${t.id}" ${tasksUI.tSelected.has(t.id)?'checked':''}><strong>${escHtml(t.title)}</strong>${stageBadge(t.taskStage)}</div>

          <button class="btn-icon" data-ttrash="${t.id}" title="حذف">${icon('trash')}</button>
        </div>
      </div>
      ${t.description?`<div class="muted" style="font-size:12.5px; margin-top:6px;">${escHtml(t.description)}</div>`:''}
      <div class="divider"></div>
      <div class="row between"><span class="faint" style="font-size:11.5px;">زیرکارها (${doneCount}/${subs.length})</span></div>
      <div id="subwrap_${t.id}">${subs.map(s=>`<div class="subtask-row ${s.done?'done':''}"><input type="checkbox" data-subtoggle="${s.id}" ${s.done?'checked':''}><span class="stitle" style="flex:1;">${escHtml(s.title)}</span><button class="btn-icon" data-subdel="${s.id}">${icon('x')}</button></div>`).join('')}</div>
      <div class="row" style="margin-top:8px;"><input type="text" placeholder="افزودن زیرکار…" data-subinput="${t.id}" style="flex:1; height:34px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); padding:0 10px;"><button class="btn btn-sm btn-ghost" data-subadd="${t.id}">${icon('plus')}</button></div>
    </div>`;
  })).then(a=>a.join(''));

  wrap.querySelectorAll('[data-tsel]').forEach(cb=> cb.onchange = ()=>{ cb.checked?tasksUI.tSelected.add(cb.dataset.tsel):tasksUI.tSelected.delete(cb.dataset.tsel); drawTasksList(projectId); });
  wrap.querySelectorAll('[data-tedit]').forEach(b=> b.onclick = async ()=>{ const rec=await dbGet('tasks', b.dataset.tedit); renderTaskForm(projectId, rec); openAccordion('taskAcc'); document.getElementById('taskAcc').scrollIntoView({behavior:'smooth'}); });
  wrap.querySelectorAll('[data-ttrash]').forEach(b=> b.onclick = async ()=>{ const ok=await confirmModal({title:'حذف کار',body:'این کار به سطل زباله منتقل می‌شود.',confirmLabel:'انتقال به زباله',danger:true}); if(!ok) return; await setStatus('tasks', b.dataset.ttrash, 'TRASHED'); toast('به سطل زباله منتقل شد','success'); drawTasksList(projectId); });
  wrap.querySelectorAll('[data-subtoggle]').forEach(cb=> cb.onchange = async ()=>{ const s=await dbGet('subTasks', cb.dataset.subtoggle); s.done=cb.checked; await dbPut('subTasks', s); drawTasksList(projectId); });
  wrap.querySelectorAll('[data-subdel]').forEach(b=> b.onclick = async ()=>{ await dbDelete('subTasks', b.dataset.subdel); drawTasksList(projectId); });
  wrap.querySelectorAll('[data-subadd]').forEach(b=> b.onclick = async ()=>{

    drawTasksList(projectId);
  });
}

function computeServiceStatus(vehicle, svc){
  let dateStatus=null, kmStatus=null;
  if(svc.expiryDateIso){
    const daysLeft = (new Date(svc.expiryDateIso) - new Date())/(1000*3600*24);
    dateStatus = daysLeft<0 ? 'overdue' : (daysLeft<=30 ? 'near' : 'valid');
  }
  if(svc.usefulDistance && svc.serviceKm!=null && vehicle.currentKm!=null){
    const remaining = (Number(svc.serviceKm) + Number(svc.usefulDistance)) - Number(vehicle.currentKm);
    kmStatus = remaining<0 ? 'overdue' : (remaining <= Number(svc.usefulDistance)*0.1 ? 'near' : 'valid');
  }
  if(!dateStatus && !kmStatus) return 'unknown';
  if(dateStatus==='overdue'||kmStatus==='overdue') return 'overdue';
  if(dateStatus==='near'||kmStatus==='near') return 'near';
  return 'valid';
}
function serviceStatusBadge(s){
  const map={ valid:['success','معتبر'], near:['warning','نزدیک به سررسید'], overdue:['danger','سررسیدشده'], unknown:['neutral','نامشخص'] };
  const [cls,label]=map[s];
  return `<span class="badge ${cls}">${label}</span>`;
}

function renderDynFieldInput(field, value){
  const id = 'cf_'+field.key;
  if(field.type==='boolean') return `<div class="field"><label class="row" style="gap:8px; cursor:pointer;"><input type="checkbox" id="${id}" ${value?'checked':''}><span>${escHtml(field.label)}</span></label></div>`;
  if(field.type==='select') return `<div class="field"><label>${escHtml(field.label)}</label>${selectOptionsHtml(id, field.options||[], value)}</div>`;
  if(field.type==='multiselect'){
    const opts = field.options||[]; const sel = Array.isArray(value)?value:[];
    return `<div class="field"><label>${escHtml(field.label)}</label><select id="${id}" multiple size="${Math.min(Math.max(opts.length,3),5)}">${opts.map(o=>`<option value="${escAttr(o)}" ${sel.includes(o)?'selected':''}>${escHtml(o)}</option>`).join('')}</select></div>`;
  }
  if(field.type==='date') return `<div class="field"><label>${escHtml(field.label)}</label>${jalaliDateSelectHtml(id, value)}</div>`;
  if(field.type==='number') return `<div class="field"><label>${escHtml(field.label)}</label><input type="number" id="${id}" value="${value??''}"></div>`;
  return `<div class="field"><label>${escHtml(field.label)}</label><input type="text" id="${id}" value="${escAttr(value)}"></div>`;
}
function readDynFieldValue(field){
  const id = 'cf_'+field.key;
  if(field.type==='boolean') return document.getElementById(id).checked;
  if(field.type==='multiselect') return Array.from(document.getElementById(id).selectedOptions).map(o=>o.value);
  if(field.type==='date') return readJalaliDateSelect(id).iso;
  if(field.type==='number') return parseFloat(document.getElementById(id).value)||0;
  return document.getElementById(id).value.trim();
}
function formatDynFieldValue(field, value){
  if(value==null || value===''){ return '—'; }
  if(field.type==='boolean') return value? '<span class="badge success">بله</span>':'<span class="badge neutral">خیر</span>';
  if(field.type==='multiselect') return Array.isArray(value) && value.length? value.map(escHtml).join('، ') : '—';
  if(field.type==='date'){ try{ return fmtJalali(new Date(value)); }catch{ return '—'; } }
  if(field.type==='file') return Array.isArray(value) && value.length? `${value.length.toLocaleString('fa-IR')} فایل` : '—';
  return escHtml(String(value));
}

  document.getElementById('cmRecFormBody').innerHTML = `

async function drawCustomRecordsList(mod){

  if(!list.length){ tbody.innerHTML = `<tr><td colspan="${cols.length+2}"><div class="empty-state">${icon('doc')}<div class="msg">هنوز رکوردی ثبت نشده است</div></div></td></tr>`; document.getElementById('cmSelectAllRow').innerHTML=''; document.getElementById('cmBulkBar').innerHTML=''; return; }

    <tr>
      <td><input type="checkbox" data-sel="${r.id}" ${sel.has(r.id)?'checked':''}></td>

    </tr>`).join('');
  document.getElementById('cmSelectAllRow').innerHTML = `<input type="checkbox" id="cmSelectAll"><label for="cmSelectAll" class="faint" style="font-size:12.5px;">انتخاب همه (${list.length.toLocaleString('fa-IR')})</label>`;
  document.getElementById('cmSelectAll').onchange = e=>{ list.forEach(r=> e.target.checked?sel.add(r.id):sel.delete(r.id)); drawCustomRecordsList(mod); };
  document.getElementById('cmBulkBar').innerHTML = bulkBar(sel.size, [{key:'archive',label:'بایگانی گروهی'},{key:'trash',label:'حذف گروهی',danger:true}]);
  document.querySelectorAll('#cmBulkBar [data-bulk]').forEach(b=> b.onclick = async ()=>{
    const ids=[...sel];
    if(b.dataset.bulk==='archive'){ for(const id of ids) await setStatus('customRecords', id, 'ARCHIVED'); }
    if(b.dataset.bulk==='trash'){ const ok=await confirmModal({title:'حذف گروهی',body:`${ids.length} رکورد به سطل زباله منتقل می‌شود.`,confirmLabel:'انتقال به زباله',danger:true}); if(!ok) return; for(const id of ids) await setStatus('customRecords', id, 'TRASHED'); }
    sel.clear(); drawCustomRecordsList(mod); toast('انجام شد','success');
  });
  tbody.querySelectorAll('[data-sel]').forEach(cb=> cb.onchange=()=>{ cb.checked?sel.add(cb.dataset.sel):sel.delete(cb.dataset.sel); drawCustomRecordsList(mod); });
  tbody.querySelectorAll('[data-edit]').forEach(b=> b.onclick = async ()=>{ const rec=await dbGet('customRecords', b.dataset.edit); renderCustomRecordForm(mod, rec); openAccordion('cmRecAcc'); document.getElementById('cmRecAcc').scrollIntoView({behavior:'smooth'}); });
  tbody.querySelectorAll('[data-archive]').forEach(b=> b.onclick = async ()=>{ await setStatus('customRecords', b.dataset.archive, 'ARCHIVED'); toast('بایگانی شد','success'); drawCustomRecordsList(mod); });
  tbody.querySelectorAll('[data-trash]').forEach(b=> b.onclick = async ()=>{ const ok=await confirmModal({title:'حذف رکورد',body:'این رکورد به سطل زباله منتقل می‌شود.',confirmLabel:'انتقال به زباله',danger:true}); if(!ok) return; await setStatus('customRecords', b.dataset.trash, 'TRASHED'); toast('به سطل زباله منتقل شد','success'); drawCustomRecordsList(mod); });
}

async function saveJsonFileDownload(obj, filename){
  const text = JSON.stringify(obj);
  const dl = await getDownloadsCap();
  if(dl){
    try{
      const blob = new Blob([text], { type:'application/json' });
      const res = await dl.save({ filename, data: blob });
      if(res && res.status==='saved') return true;
      if(res && res.status==='declined') return false;
    }catch(err){ if(err && err.code==='declined') return false; /* سایر خطاها: روش جایگزین */ }
  }
  if(browserSaveBlob(new Blob([text], { type:'application/json' }), filename)){ return true; }
  showBackupFallbackModal(text, filename);
  return false;
}

async function buildEncryptedBackupWrapper(type, pw){
  const payload = type==='admin' ? await buildAdminBackupPayload() : await buildUserBackupPayload();
  const salt = randHex(16);
  const key = await deriveAesKey(pw, salt);
  const enc = await aesEncrypt(JSON.stringify(payload), key);
  return { app:'samin-backup', v:1, type, salt, iv:enc.iv, data:enc.data, createdAt:new Date().toISOString() };
}
async function runBackupFlow(type){
  if(!HAS_SUBTLE){ toast('رمزنگاری پشتیبان در این محیط در دسترس نیست (نیازمند اتصال امن).','error'); return; }
  const pw = await promptBackupPassword(type==='admin'?'رمز Backup کامل سیستم':'رمز Backup اطلاعات من');
  if(!pw) return;
  const wrapper = await buildEncryptedBackupWrapper(type,pw);
  const filename = `samin-backup-${type}-${state.currentUser.username}-${Date.now()}.json`;
  const ok = await saveJsonFileDownload(wrapper, filename);
  if(ok){
    await logActivity(state.currentUser.id, 'CREATE', type==='admin'?'تهیه پشتیبان کامل سیستم':'تهیه پشتیبان از اطلاعات شخصی');
    toast('فایل پشتیبان آماده دانلود شد','success');
  }
}

const GOOGLE_DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
const GOOGLE_GIS_SRC='https://accounts.google.com/gsi/client';
let googleAccessToken=null;
let googleAccessTokenExpiresAt=0;
let googleTokenClient=null;
let googleGISPromise=null;
let googleTokenWaiter=null;
function googleDriveOriginSupported(){
  return location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1' || location.hostname.endsWith('.localhost');
}
async function getGlobalAppSetting(id){ const s=await dbGet('appSettings',id); return s?s.value:null; }
async function setGlobalAppSetting(id,value){ await dbPut('appSettings',{id,value}); }
async function getGoogleClientId(){ return String((await getGlobalAppSetting('googleOAuthClientId'))||'').trim(); }
async function getGoogleDrivePrefs(){
  const settings=(await dbGetAll('userSettings',s=>s.ownerUserId===state.currentUser.id))[0];
  return settings?.googleDrive && typeof settings.googleDrive==='object' ? settings.googleDrive : {};
}
async function saveGoogleDrivePrefs(prefs){ await saveUserSetting('googleDrive',{...(await getGoogleDrivePrefs()),...prefs}); }
async function loadGoogleIdentityServices(){
  if(window.google?.accounts?.oauth2) return;
  if(!googleGISPromise){
    googleGISPromise=new Promise((resolve,reject)=>{
      const existing=document.querySelector(`script[src="${GOOGLE_GIS_SRC}"]`);
      if(existing){ existing.addEventListener('load',()=>resolve(),{once:true}); existing.addEventListener('error',()=>reject(new Error('بارگذاری Google Identity Services ناموفق بود.')),{once:true}); return; }
      const script=document.createElement('script'); script.src=GOOGLE_GIS_SRC; script.async=true; script.defer=true;
      script.onload=()=>window.google?.accounts?.oauth2?resolve():reject(new Error('کتابخانه مجوزدهی گوگل در دسترس نیست.'));
      script.onerror=()=>reject(new Error('بارگذاری کتابخانه اتصال گوگل ناموفق بود.'));
      document.head.appendChild(script);
    });
  }
  await googleGISPromise;
}
function googleRequestAccessToken(){
  return new Promise(async (resolve,reject)=>{
    try{
      const clientId=await getGoogleClientId();
      if(!clientId){ reject(new Error('ابتدا شناسه OAuth گوگل را ذخیره کنید.')); return; }
      await loadGoogleIdentityServices();
      if(!google.accounts?.oauth2){ reject(new Error('سرویس مجوزدهی گوگل در این مرورگر در دسترس نیست.')); return; }
      googleTokenWaiter={resolve,reject};
      googleTokenClient=google.accounts.oauth2.initTokenClient({
        client_id:clientId,
        scope:GOOGLE_DRIVE_SCOPE,
        callback:(response)=>{
          const waiter=googleTokenWaiter; googleTokenWaiter=null;
          if(response?.error){ waiter?.reject(new Error(response.error_description||response.error)); return; }
          googleAccessToken=response.access_token||null;
          googleAccessTokenExpiresAt=Date.now()+Math.max(0,(Number(response.expires_in)||3600)-30)*1000;
          waiter?.resolve(googleAccessToken);
        },
        error_callback:(err)=>{
          const waiter=googleTokenWaiter; googleTokenWaiter=null;
          waiter?.reject(new Error(err?.type==='popup_closed'?'پنجره اتصال گوگل بسته شد.':'پنجره اتصال گوگل باز نشد.'));
        }
      });
      googleTokenClient.requestAccessToken();
    }catch(err){ reject(err); }
  });
}
async function ensureGoogleAccessToken(){
  if(!googleDriveOriginSupported()) throw new Error('اتصال Google Drive فقط در سامینِ اجراشده روی HTTPS یا localhost قابل استفاده است.');
  if(googleAccessToken && Date.now()<googleAccessTokenExpiresAt) return googleAccessToken;
  return googleRequestAccessToken();
}
async function googleDriveFetch(url, options={}){
  const token=await ensureGoogleAccessToken();
  const headers=new Headers(options.headers||{});
  headers.set('Authorization',`Bearer ${token}`);
  const res=await fetch(url,{...options,headers});
  if(res.status===401){ googleAccessToken=null; googleAccessTokenExpiresAt=0; throw new Error('نشست Google Drive منقضی یا لغو شده است؛ دوباره اتصال را بزنید.'); }
  if(!res.ok){ let msg=`Google Drive خطا ${res.status}`; try{ const j=await res.json(); msg=j?.error?.message||msg; }catch{} throw new Error(msg); }
  return res;
}
function driveQueryEscape(v){ return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
async function findOrCreateGoogleBackupFolder(){
  const prefs=await getGoogleDrivePrefs();
  if(prefs.folderId) return prefs.folderId;
  const ownerKey=state.currentUser.id;
  const q=encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and trashed=false and appProperties has { key='saminBackupFolder' and value='1' } and appProperties has { key='saminOwnerKey' and value='${driveQueryEscape(ownerKey)}' }`);
  const listRes=await googleDriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&spaces=drive&fields=files(id,name)&pageSize=20`);
  const list=await listRes.json();
  if(list.files?.[0]?.id){ await saveGoogleDrivePrefs({folderId:list.files[0].id}); return list.files[0].id; }
  const body={
    name:`پشتیبان‌های سامین — ${state.currentUser.username}`,
    mimeType:'application/vnd.google-apps.folder',
    appProperties:{saminBackupFolder:'1',saminOwnerKey:ownerKey}
  };
  const createRes=await googleDriveFetch('https://www.googleapis.com/drive/v3/files?fields=id,name',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const folder=await createRes.json();
  if(!folder?.id) throw new Error('ساخت پوشه پشتیبان در Google Drive انجام نشد.');
  await saveGoogleDrivePrefs({folderId:folder.id});
  return folder.id;
}
async function uploadBackupToGoogleDrive(type){
  if(!HAS_SUBTLE){ toast('رمزنگاری پشتیبان در این محیط در دسترس نیست.','error'); return; }
  try{
    const clientId=await getGoogleClientId();
    if(!clientId){ toast('ابتدا شناسه OAuth گوگل را در همین بخش ذخیره کنید.','error'); document.getElementById('googleClientId')?.focus(); return; }
    const pw=await promptBackupPassword(type==='admin'?'رمز Backup کامل سیستم برای Google Drive':'رمز Backup اطلاعات من برای Google Drive');
    if(!pw) return;
    const wrapper=await buildEncryptedBackupWrapper(type,pw);
    const folderId=await findOrCreateGoogleBackupFolder();
    const filename=`samin-backup-${type}-${state.currentUser.username}-${Date.now()}.json`;
    const boundary='samin_'+uuid().replaceAll('-','');
    const meta={name:filename,mimeType:'application/json',parents:[folderId],description:'Samin encrypted backup',appProperties:{saminBackup:'1',saminType:type}};
    const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(wrapper)}\r\n--${boundary}--`;
    await googleDriveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body});
    await saveGoogleDrivePrefs({connectedAt:new Date().toISOString(),lastBackupAt:new Date().toISOString(),lastBackupName:filename,lastBackupType:type});
    await logActivity(state.currentUser.id,'CREATE',type==='admin'?'انتقال پشتیبان کامل سیستم به Google Drive':'انتقال پشتیبان اطلاعات شخصی به Google Drive');
    toast('پشتیبان رمزنگاری‌شده با موفقیت در Google Drive ذخیره شد','success');
    renderSettingsPane();
  }catch(err){ toast(err?.message||'انتقال به Google Drive ناموفق بود','error'); }
}
async function listGoogleDriveBackups(){
  const folderId=(await getGoogleDrivePrefs()).folderId;
  if(!folderId) return [];
  const q=encodeURIComponent(`'${driveQueryEscape(folderId)}' in parents and trashed=false and appProperties has { key='saminBackup' and value='1' }`);
  const res=await googleDriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&orderBy=modifiedTime desc&fields=files(id,name,size,modifiedTime,appProperties)&pageSize=50`);
  const data=await res.json();
  return Array.isArray(data.files)?data.files:[];
}

/* ================= قفل خودکار (AUTO LOCK) ================= */
let autoLockTimer = null;
function resetAutoLockTimer(){
  if(autoLockTimer){ clearTimeout(autoLockTimer); autoLockTimer=null; }
  if(!state.currentUser || state.view!=='app' || state.locked) return;
  const mins = state.autoLockMinutes||0;
  if(!mins) return;
  autoLockTimer = setTimeout(triggerAutoLock, mins*60000);
}
function triggerAutoLock(){
  if(!state.currentUser || state.locked) return;
  state.locked = true;
  state.vaultKey = null;
  renderLockScreen();
}
function renderLockScreen(){
  const overlay = document.createElement('div');
  overlay.className = 'lock-overlay'; overlay.id='samLockOverlay';
  const passwordless = isPasswordlessUser(state.currentUser);
  overlay.innerHTML = `
    <div class="lock-card">
      <div class="brand lg" style="justify-content:center; margin-bottom:8px;">${brandMarkSvg()}<span class="word">سامین</span></div>
      <div class="faint" style="font-size:13px; margin-bottom:18px;">سامین به دلیل عدم فعالیت قفل شده است</div>
      <div id="lockErr"></div>
      ${passwordless ? `
        <p class="muted" style="font-size:12px;line-height:1.8;margin-bottom:14px;">این حساب ورود بدون رمز دارد.</p>
        <button type="button" class="btn btn-primary" id="unlockNoPwBtn" style="width:100%;">${icon('lock')} ادامه بدون رمز</button>` : `
        <form id="unlockForm">
          <div class="field"><label>رمز عبور</label><input type="password" id="unlockPw" autofocus></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">${icon('lock')} باز کردن قفل</button>
        </form>`}
      <button class="btn btn-ghost btn-sm" id="lockLogoutBtn" style="margin-top:14px;">خروج از حساب</button>
    </div>`;
  document.body.appendChild(overlay);
  const unlockNow = ()=>{
    state.locked = false;
    overlay.remove();
    resetAutoLockTimer();
    render_currentPage && render_currentPage();
  };
  if(passwordless){
    document.getElementById('unlockNoPwBtn').onclick = unlockNow;
  }else{
    document.getElementById('unlockForm').onsubmit = async (e)=>{
      e.preventDefault();
      const pw = document.getElementById('unlockPw').value;
      const ok = await verifyPassword(pw, state.currentUser.salt, state.currentUser.hash);
      if(!ok){ document.getElementById('lockErr').innerHTML = `<div class="login-error">${icon('x')}<span>رمز عبور نادرست است.</span></div>`; return; }
      unlockNow();
    };
  }
  document.getElementById('lockLogoutBtn').onclick = async ()=>{
    overlay.remove(); state.locked=false; await doLogout();
  };
}
['mousemove','keydown','click','touchstart','scroll'].forEach(evt=>{
  document.addEventListener(evt, ()=>{ if(state.currentUser && !state.locked && state.view==='app') resetAutoLockTimer(); }, {passive:true});
});

let tourState = null;
function maybeShowTour(){
  if(state.onboardingDone || tourState) return;
  setTimeout(()=>{ if(state.view==='app' && !state.onboardingDone && !tourState && !state.locked) startTour(false); }, 700);
}
function startTour(manual){
  if(tourState) return;
  if(manual && state.menuActive!=='dashboard'){ navigateTo('dashboard'); }
  tourState = { i:0, manual };
  const layer = document.createElement('div');
  layer.id = 'tourLayer'; layer.className = 'tour-layer';
  layer.innerHTML = `<div class="tour-block"></div><div class="tour-spot none" id="tourSpot"></div><div class="tour-card" id="tourCard"></div>`;
  document.body.appendChild(layer);
  window.addEventListener('resize', tourReposition);
  document.addEventListener('keydown', tourKey);
  setTimeout(()=>showTourStep(0), manual?450:0);
}
function tourKey(e){ if(e.key==='Escape') endTour(); }
function showTourStep(i){
  if(!tourState) return;
  tourState.i = i;
  const st = TOUR_STEPS[i];
  if(st.openDrawer){ state.menuOpen = true; } else { state.menuOpen = false; }
  syncDrawer();
  const card = document.getElementById('tourCard');
  card.innerHTML = `
    <div class="t-icon">${icon(st.icon)}</div>
    <h3>${st.title}</h3>
    <p>${st.text}</p>
    <div class="tour-dots">${TOUR_STEPS.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="tour-actions">
      <button class="btn btn-ghost btn-sm" id="tourSkip">${i===TOUR_STEPS.length-1?'بستن':'رد شدن'}</button>
      <span class="grow"></span>
      ${i>0?`<button class="btn btn-ghost btn-sm" id="tourPrev">قبلی</button>`:''}
      <button class="btn btn-primary btn-sm" id="tourNext">${i===TOUR_STEPS.length-1?'شروع استفاده':'بعدی'}</button>
    </div>`;
  document.getElementById('tourSkip').onclick = ()=>endTour();
  const prev = document.getElementById('tourPrev'); if(prev) prev.onclick = ()=>showTourStep(i-1);
  document.getElementById('tourNext').onclick = ()=>{ if(i>=TOUR_STEPS.length-1) endTour(); else showTourStep(i+1); };
  card.style.animation='none'; void card.offsetWidth; card.style.animation='';
  setTimeout(tourReposition, st.openDrawer?380:30);
}
function tourReposition(){
  if(!tourState) return;
  const st = TOUR_STEPS[tourState.i];
  const spot = document.getElementById('tourSpot'), card = document.getElementById('tourCard');
  if(!spot || !card) return;
  let target = st.target ? document.querySelector(st.target) : null;
  let r = target ? target.getBoundingClientRect() : null;
  if(r && (r.width===0 || r.height===0)) { r = null; }
  const vw = window.innerWidth, vh = window.innerHeight, cw = card.offsetWidth, ch = card.offsetHeight;
  if(r){
    const pad = 6;
    spot.classList.remove('none');
    spot.style.top=(r.top-pad)+'px'; spot.style.left=(r.left-pad)+'px'; spot.style.width=(r.width+pad*2)+'px'; spot.style.height=(r.height+pad*2)+'px';
    let top, left;
    if(r.height > vh*0.45){
      if(vw - r.right - 16 >= cw){ left = r.right+16; top = Math.max(16,(vh-ch)/2); }
      else { left = (vw-cw)/2; top = vh-ch-16; }
    } else {
      top = r.bottom + pad + 14;
      if(top + ch > vh-12) top = Math.max(12, r.top - pad - 14 - ch);
      left = r.left + r.width/2 - cw/2;
    }
    left = Math.min(Math.max(12,left), vw-cw-12);
    card.style.top = top+'px'; card.style.left = left+'px';
  } else {
    spot.classList.add('none');
    spot.style.top=(vh/2)+'px'; spot.style.left=(vw/2)+'px';
    card.style.top = Math.max(12,(vh-ch)/2)+'px'; card.style.left = Math.max(12,(vw-cw)/2)+'px';
  }
}
function endTour(){
  if(!tourState) return;
  const wasManual = tourState.manual;
  tourState = null;
  document.getElementById('tourLayer')?.remove();
  window.removeEventListener('resize', tourReposition);
  document.removeEventListener('keydown', tourKey);
  state.menuOpen = false; syncDrawer();
  if(!state.onboardingDone){ state.onboardingDone = true; saveUserSetting('onboardingDone', true).catch(()=>{}); }
  if(!wasManual) toast('هر زمان بخواهید آموزش را از «راهنما» دوباره ببینید.','info');
}

/* ================= بازنشانی (RESET / FACTORY RESET) ================= */
function promptDangerConfirm({ title, body, word, confirmLabel }){
  return new Promise(resolve=>{
    const overlay = document.createElement('div'); overlay.className='modal-overlay';
    overlay.innerHTML = `<div class="modal"><div class="modal-head"><div class="modal-title" style="color:var(--danger);">${title}</div></div>
      <div class="modal-body">
        <p class="muted" style="font-size:13px; line-height:1.9; margin-bottom:12px;">${body}</p>
        <div class="field"><label>رمز عبور حساب شما</label><input type="password" id="dzPw" autocomplete="current-password"></div>
        <div class="field"><label>برای تأیید، عبارت «${word}» را تایپ کنید</label><input type="text" id="dzWord"></div>
        <div id="dzErr"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" data-act="cancel">انصراف</button><button class="btn btn-danger" data-act="ok">${confirmLabel}</button></div></div>`;
    document.body.appendChild(overlay); requestAnimationFrame(()=>overlay.classList.add('open'));
    const close = (v)=>{ overlay.classList.remove('open'); setTimeout(()=>overlay.remove(),200); resolve(v); };
    overlay.addEventListener('click', async (e)=>{
      if(e.target===overlay || e.target.dataset.act==='cancel'){ close(false); return; }
      if(e.target.dataset.act==='ok'){
        const pw = overlay.querySelector('#dzPw').value, w = overlay.querySelector('#dzWord').value.trim();
        const err = (m)=>{ overlay.querySelector('#dzErr').innerHTML = `<div class="login-error">${icon('x')}<span>${m}</span></div>`; };
        if(w!==word){ err('عبارت تأیید درست وارد نشده است.'); return; }
        const ok = await verifyPassword(pw, state.currentUser.salt, state.currentUser.hash);
        if(!ok){ err('رمز عبور نادرست است.'); return; }
        close(true);
      }
    });
  });
}
async function resetMyData(){
  const uid = state.currentUser.id;
  await logActivity(uid, 'DELETE', 'پاک‌سازی همه اطلاعات شخصی (بازنشانی کاربر)');
  for(const [name] of STORE_DEFS){
    if(['users','appSettings','activityLog','userSessions'].includes(name)) continue;
    const recs = await dbGetAll(name, r=>r && r.ownerUserId===uid);
    for(const r of recs) await dbDelete(name, r.id);
  }
  state.vaultKey = null; state.customModulesCache = []; state.autoLockMinutes = 0; state.navStack = [];
  resetAutoLockTimer();
  setTheme('onyx-dark', false);
  state.onboardingDone = true; await saveUserSetting('onboardingDone', true);
  state.menuActive = 'dashboard'; renderDrawerMenu(); updateNavBtn(); renderContent();
  toast('همه اطلاعات شخصی شما پاک شد.','success');
}
async function factoryResetSystem(){
  for(const [name] of STORE_DEFS){ await dbClear(name); }
  try{ localStorage.removeItem('samin_theme'); }catch{}
  ssDel('samin_session_uid');
  if(autoLockTimer){ clearTimeout(autoLockTimer); autoLockTimer=null; }
  Object.assign(state, { currentUser:null, vaultKey:null, customModulesCache:[], navStack:[], menuActive:'dashboard', settingsTab:'profile', drawerView:'list', locked:false, autoLockMinutes:0, onboardingDone:true, menuOpen:false });
  setTheme('onyx-dark', false);
  await ensureSeed();
  state.view = 'login';
  render();
  toast('نرم‌افزار به حالت کارخانه بازگشت. با admin / admin وارد شوید.','success');
}

  document.getElementById('resetMyDataBtn').onclick = async ()=>{

  document.getElementById('factoryResetBtn')?.addEventListener('click', async ()=>{
    const ok = await promptDangerConfirm({ title:'بازنشانی کارخانه‌ای کل سیستم', body:'همه کاربران و همه اطلاعات حذف می‌شود و سامین به حالت اولیه برمی‌گردد.', word:'ریست کارخانه', confirmLabel:'بازنشانی کامل' });
    if(ok){ await factoryResetSystem(); }

}

/* ================= BOOTSTRAP ================= */
window.addEventListener('unhandledrejection', (e)=>{ if(state.view==='boot'){ renderBootError(e.reason); } });
/* ===== Field titles → in-field placeholder text ===== */
const PH_SELECTOR='input[type=text],input[type=password],input[type=number],input[type=email],input[type=tel],input[type=search],input:not([type]),textarea';
function applyPlaceholders(root){
  (root||document).querySelectorAll('.field:not([data-ph])').forEach(f=>{
    f.setAttribute('data-ph','1');
    const label=[...f.children].find(c=>c.tagName==='LABEL' && !c.querySelector('input,select,textarea'));
    if(!label) return;
    const text=label.textContent.trim().replace(/\s+/g,' ');
    if(!text || text.length>42) return;
    const ctrls=f.querySelectorAll('input,textarea,select');
    if(ctrls.length!==1) return;
    const el=ctrls[0];
    if(el.tagName==='SELECT'){
      const first=el.options[0];
      if(el.multiple || !first || first.value!=='') return;
      first.textContent=text;
    } else if(el.matches(PH_SELECTOR)){
      const old=el.getAttribute('placeholder');
      el.setAttribute('placeholder', old ? text+' · '+old : text);
    } else return;
    el.setAttribute('aria-label', text);
    if(!el.title) el.title=text;
    f.classList.add('ph');
  });
}
new MutationObserver(()=>applyPlaceholders(document)).observe(document.body,{childList:true,subtree:true});

async function boot(){
  render();
  try{
    try{ await openDB(); }catch(dbErr){ memEnable(); }
    await ensureSeed();
    const savedUid = ssGet('samin_session_uid');
    if(savedUid){
      const u = await dbGet('users', savedUid);
      if(u && !u.mustChangePassword){
        state.currentUser = u;
        await loadUserPrefs();
        state.view='app'; state.menuActive='dashboard';
        startReminderAlarm();
        render();
        return;
      }
    }
    state.view='login';
    render();
  }catch(err){
    renderBootError(err);
  }
}
function renderBootError(err){
  const isFileProtocol = location.protocol==='file:';
  app.innerHTML = `
    <div class="login-wrap">
      <div class="login-card" style="max-width:460px;">
        <div class="login-head">
          <div class="brand lg">${brandMarkSvg()}<span class="word">سامین</span></div>
        </div>
        <div class="login-error" style="align-items:flex-start; flex-direction:column; gap:8px;">
          <div class="row" style="gap:8px;">${icon('x')}<strong>سامین نتوانست پایگاه‌داده را باز کند</strong></div>
          <div style="font-size:12.5px; line-height:1.9;">
            ${isFileProtocol
              ? 'این صفحه با آدرس file:// باز شده است. مرورگرها به دلایل امنیتی روی فایل‌های لوکال به IndexedDB اجازه دسترسی نمی‌دهند، بنابراین سامین نمی‌تواند اطلاعات را ذخیره کند.<br><br><strong>راه‌حل:</strong> از لینک آنلاینی که برای شما ارسال شده استفاده کنید، یا این فایل را از طریق یک وب‌سرور محلی باز کنید (نه با دوبار کلیک).'
              : 'دلیل دقیق: ' + (err && err.message ? err.message : 'نامشخص') + '<br><br>لطفاً مطمئن شوید مرورگر شما به‌روز است، حالت Incognito/Private با ذخیره‌سازی غیرفعال نیست، و فضای ذخیره‌سازی مرورگر پر نشده باشد.'}
          </div>
        </div>
        <button class="btn btn-primary" id="bootRetryBtn" style="width:100%; margin-top:6px;">تلاش دوباره</button>
      </div>
    </div>`;
  document.getElementById('bootRetryBtn').onclick = ()=>{ _dbPromise=null; state.view='boot'; render(); boot(); };
}
boot();
